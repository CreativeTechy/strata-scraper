services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    # -h 127.0.0.1 forces the check over TCP. pg_isready's default unix-socket
    # probe passes during initdb - the entrypoint runs the schema.sql above
    # against a socket-only temporary server and only opens the TCP port once
    # that finishes - so a socket check would report healthy while the backend
    # still cannot connect.
    # $$POSTGRES_USER/$$POSTGRES_DB are escaped so the container's own shell
    # substitutes them (from the environment block above) rather than compose
    # interpolating at parse time.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  adminer:
    image: adminer:4
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8083:8080"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Waits for the healthcheck above, not just for the container to start:
    # main.py connects to Postgres during startup and uvicorn exits on
    # failure, so a plain `- db` left the backend crash-looping (and /api
    # returning 502) through the first-boot initdb.
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Fully-offline local LLM, opt-in via `docker compose --profile ollama up`.
  # Not started by a plain `docker compose up`, so deployments using
  # OpenAI/DeepSeek pay no cost for it. To actually route the backend here,
  # set OLLAMA_CHAT_BASE_URL=http://ollama:11434/v1/chat/completions in
  # backend/.env - "ollama" is this service's name, resolvable from the
  # backend container over the Docker network, but not from backend/.env's
  # own localhost default (which would resolve to the backend container
  # itself). Point OLLAMA_CHAT_BASE_URL at a remote tunnel (e.g. ngrok in
  # front of Ollama running on Google Colab) instead to test against that
  # without touching this file.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    profiles: ["ollama"]

  # One-shot: pulls OLLAMA_CHAT_MODEL (backend/.env, default llama3.1) into
  # the `ollama-data` volume once the server is healthy, then exits. Re-run
  # via `docker compose --profile ollama up ollama-pull` after changing the
  # model - already-pulled models are a no-op.
  ollama-pull:
    image: ollama/ollama:latest
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_CHAT_MODEL:-llama3.1}\""]
    restart: "no"
    profiles: ["ollama"]

  frontend:
    build:
      context: ./dashboard
      args:
        VITE_API_TARGET: ${VITE_API_TARGET:-}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8211:80"
    restart: unless-stopped

volumes:
  pgdata:
  ollama-data:
